<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Axis Matching</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #fff;
    --border: #e5e5e5;
    --text: #1a1a1a;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --green: #16a34a;
    --red: #dc2626;
    --orange: #ea580c;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
  h2 { font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

  /* Form */
  .search-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
  }
  .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-row input:focus { border-color: var(--accent); }
  .btn {
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Options */
  .options { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .options label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .options input[type="checkbox"] { accent-color: var(--accent); }
  .options select {
    padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 12px; background: var(--card); color: var(--text);
  }
  .options select:disabled { opacity: 0.4; }

  /* Status */
  .status { font-size: 13px; color: var(--muted); margin-bottom: 16px; min-height: 20px; }
  .status.error { color: var(--red); }

  /* Results */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 12px;
    position: relative;
  }
  .result-card.disqualified { border-color: var(--red); opacity: 0.7; }
  .rank-badge {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 24px;
    font-weight: 700;
    color: var(--muted);
  }
  .rank-badge.rank-1 { color: var(--accent); }
  .result-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; padding-right: 50px; }
  .result-score {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .result-confidence { font-size: 13px; color: var(--muted); margin-left: 8px; }
  .result-meta { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .disqualified-badge {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
  }

  /* Axis scores */
  .axis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .axis-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    padding: 6px 8px;
    background: var(--bg);
    border-radius: 4px;
  }
  .axis-name { font-weight: 500; min-width: 80px; }
  .axis-bar { flex: 1; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .axis-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .axis-bar-fill.supported { background: var(--green); }
  .axis-bar-fill.conflict { background: var(--orange); }
  .axis-bar-fill.unknown { background: #d1d5db; }
  .axis-score { font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
  .axis-status { font-size: 11px; min-width: 60px; }
  .axis-status.supported { color: var(--green); }
  .axis-status.conflict { color: var(--orange); }
  .axis-status.unknown { color: var(--muted); }

  /* Details toggle */
  .details-toggle {
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    margin-top: 8px;
    user-select: none;
  }
  .details-content { display: none; margin-top: 8px; font-size: 13px; }
  .details-content.open { display: block; }
  .detail-section { margin-bottom: 8px; }
  .detail-label { font-weight: 500; font-size: 12px; color: var(--muted); }
  .detail-list { margin: 2px 0 0 16px; }
  .detail-list li { margin-bottom: 2px; }

  /* Diagnostics */
  .diag-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 12px;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
    color: var(--muted);
  }
  .diag-card summary { cursor: pointer; font-weight: 500; color: var(--text); font-size: 13px; }
  .diag-pre { margin-top: 8px; white-space: pre-wrap; word-break: break-all; }

  /* Summary panel */
  .summary-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 16px;
  }
  .summary-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .summary-row { display: flex; gap: 8px; font-size: 13px; padding: 3px 0; }
  .summary-label { font-weight: 500; color: var(--muted); min-width: 180px; }
  .summary-val { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; }
  .gate-pass { color: var(--green); font-weight: 600; }
  .gate-review { color: var(--orange); font-weight: 600; }
  .gate-empty { color: var(--muted); }
  .summary-list { margin: 4px 0 4px 16px; font-size: 12px; }
  .summary-list li { margin-bottom: 2px; font-family: 'SF Mono', Monaco, monospace; }
  .load-summary-btn {
    font-size: 12px; color: var(--accent); cursor: pointer; border: none;
    background: none; padding: 0; text-decoration: underline;
  }

  /* Ablation comparison */
  .ablation-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ablation-col { min-width: 0; }
  .ablation-col h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .diff-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px;
  }
  .diff-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .diff-row { display: flex; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--bg); }
  .diff-label { font-weight: 500; color: var(--muted); min-width: 100px; }
  .diff-val { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; }
  .diff-arrow { color: var(--accent); font-weight: 600; }
  .diff-changed { background: var(--accent-light); padding: 2px 6px; border-radius: 3px; }

  @media (max-width: 700px) { .ablation-wrapper { grid-template-columns: 1fr; } }

  /* Axis reasons */
  .axis-reasons { margin-top: 4px; }
  .axis-reason { padding: 3px 0; font-size: 12px; color: var(--text); }
  .axis-reason-name { font-weight: 600; color: var(--muted); }

  /* Source data */
  .source-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .source-title { font-weight: 600; font-size: 14px; margin: 4px 0 2px; }
  .source-desc { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .source-attrs { font-size: 12px; border-collapse: collapse; width: 100%; }
  .source-attrs td { padding: 3px 8px; border-bottom: 1px solid var(--bg); }
  .src-key { font-weight: 500; color: var(--muted); white-space: nowrap; width: 1%; }
  .src-val { font-family: 'SF Mono', Monaco, monospace; font-size: 11px; word-break: break-all; }

  @media (max-width: 600px) {
    .axis-grid { grid-template-columns: 1fr; }
    .input-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Multi-Axis Matching</h1>

  <div class="search-card">
    <div class="input-row">
      <input id="query" type="text" placeholder="恵比寿で静かに話せるイタリアン。予算は3000円以内"
             value="恵比寿で静かに話せるイタリアン。予算は3000円以内">
      <button class="btn" id="searchBtn" onclick="runSearch()">Search</button>
      <button class="btn" id="compareBtn" onclick="runAblation()" style="background:var(--muted)">Compare</button>
    </div>
    <div class="options">
      <label><input type="checkbox" id="liveMode" onchange="toggleModel()"> Live (real LLM)</label>
      <select id="modelSelect" disabled>
        <option value="">Default</option>
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
        <option value="gpt-4o">GPT-4o</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
      </select>
      <label><input type="checkbox" id="strictMode"> Strict</label>
      <label><input type="checkbox" id="googlePlaces"> Google Places</label>
    </div>
  </div>

  <div style="margin-bottom:12px"><button class="load-summary-btn" onclick="loadSummary()">Load Ablation Summary</button></div>
  <div id="summaryPanel" style="display:none"></div>
  <div class="status" id="status"></div>
  <div id="diagnostics"></div>
  <div id="results"></div>
</div>

<script>
async function runSearch() {
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  const btn = document.getElementById('searchBtn');
  const status = document.getElementById('status');
  const resultsDiv = document.getElementById('results');
  const diagDiv = document.getElementById('diagnostics');

  btn.disabled = true;
  status.className = 'status';
  status.textContent = 'Searching...';
  resultsDiv.innerHTML = '';
  diagDiv.innerHTML = '';

  const t0 = performance.now();

  try {
    const resp = await fetch('/api/pipeline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        live: document.getElementById('liveMode').checked,
        model: document.getElementById('modelSelect').value || null,
        enable_fallback: !document.getElementById('strictMode').checked,
        use_google_places: document.getElementById('googlePlaces').checked,
      }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || resp.statusText);
    }

    const data = await resp.json();
    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
    const ranking = data.ranking || [];

    const mode = data.mode === 'live' ? 'LIVE' : 'MOCK';
    const modelInfo = data.model ? ` (${data.model})` : '';
    status.textContent = `[${mode}${modelInfo}] ${ranking.length} candidates ranked in ${elapsed}s` +
      (data.inferred_problem_type ? ` — ${data.inferred_problem_type}` : '');

    // Diagnostics
    if (data.search_diagnostics) {
      const d = data.search_diagnostics;
      diagDiv.innerHTML = `<div class="diag-card"><details>
        <summary>Search Diagnostics — ${d.matched_stage}${d.fallback_applied ? ' (fallback)' : ''} — ${d.final_result_count} results</summary>
        <div class="diag-pre">${JSON.stringify(d, null, 2)}</div>
      </details></div>`;
    }

    // Results
    const sources = data.candidate_sources || {};
    ranking.forEach((entry, i) => {
      resultsDiv.innerHTML += renderResult(entry, sources[entry.candidate_id]);
    });

  } catch (e) {
    status.className = 'status error';
    status.textContent = `Error: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

function renderResult(e, source) {
  const dq = e.disqualified;
  const axes = (e.axis_scores || []).map(a => `
    <div class="axis-item">
      <span class="axis-name">${a.axis}</span>
      <div class="axis-bar"><div class="axis-bar-fill ${a.status}" style="width:${a.score * 100}%"></div></div>
      <span class="axis-score">${a.score.toFixed(2)}</span>
      <span class="axis-status ${a.status}">${a.status}</span>
    </div>`).join('');

  const axisReasons = (e.axis_scores || []).map(a => `
    <div class="axis-reason"><span class="axis-reason-name">${a.axis}</span>: ${a.reason || '—'}${a.hard_constraint_violation ? ' <span style="color:var(--red);font-weight:600">HARD VIOLATION</span>' : ''}</div>`).join('');

  const strengths = (e.strengths || []).length ? `<div class="detail-section"><span class="detail-label">Strengths</span><ul class="detail-list">${e.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div>` : '';
  const weaknesses = (e.weaknesses || []).length ? `<div class="detail-section"><span class="detail-label">Weaknesses</span><ul class="detail-list">${e.weaknesses.map(s=>`<li>${s}</li>`).join('')}</ul></div>` : '';
  const missing = (e.missing_information || []).length ? `<div class="detail-section"><span class="detail-label">Missing Information</span><ul class="detail-list">${e.missing_information.map(s=>`<li>${s}</li>`).join('')}</ul></div>` : '';
  const dqReasons = dq && e.disqualification_reasons ? `<div class="detail-section"><span class="detail-label">Disqualification Reasons</span><ul class="detail-list">${e.disqualification_reasons.map(s=>`<li>${s}</li>`).join('')}</ul></div>` : '';

  // Source data
  let sourceHtml = '';
  if (source) {
    const title = source.title || '';
    const desc = source.description || '';
    const attrs = source.structured_attributes || {};
    const attrRows = Object.entries(attrs).map(([k,v]) =>
      `<tr><td class="src-key">${k}</td><td class="src-val">${Array.isArray(v) ? v.join(', ') : v}</td></tr>`
    ).join('');
    sourceHtml = `
      <div class="detail-section source-section">
        <span class="detail-label">Source Data</span>
        <div class="source-title">${title}</div>
        <div class="source-desc">${desc}</div>
        ${attrRows ? `<table class="source-attrs">${attrRows}</table>` : ''}
      </div>`;
  }

  const id = `details-${e.candidate_id}`;

  return `<div class="result-card${dq ? ' disqualified' : ''}">
    <div class="rank-badge${e.rank === 1 ? ' rank-1' : ''}">#${e.rank}</div>
    <div class="result-title">${source ? source.title : e.candidate_id}${dq ? '<span class="disqualified-badge">DISQUALIFIED</span>' : ''}</div>
    <div>
      <span class="result-score">${e.total_score.toFixed(4)}</span>
      <span class="result-confidence">confidence ${e.confidence.toFixed(2)}</span>
    </div>
    <div class="result-meta">${e.summary_reason || ''}</div>
    <div class="axis-grid">${axes}</div>
    <div class="details-toggle" onclick="toggleDetails('${id}')">Details</div>
    <div class="details-content" id="${id}">
      <div class="detail-section"><span class="detail-label">Axis Reasons</span><div class="axis-reasons">${axisReasons}</div></div>
      ${strengths}${weaknesses}${missing}${dqReasons}${sourceHtml}
    </div>
  </div>`;
}

function toggleDetails(id) {
  document.getElementById(id).classList.toggle('open');
}

function toggleModel() {
  document.getElementById('modelSelect').disabled = !document.getElementById('liveMode').checked;
}

async function runAblation() {
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  const btn = document.getElementById('compareBtn');
  const status = document.getElementById('status');
  const resultsDiv = document.getElementById('results');
  const diagDiv = document.getElementById('diagnostics');

  btn.disabled = true;
  status.className = 'status';
  status.textContent = 'Running catalog ablation comparison...';
  resultsDiv.innerHTML = '';
  diagDiv.innerHTML = '';

  const t0 = performance.now();

  try {
    const resp = await fetch('/api/ablation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        live: document.getElementById('liveMode').checked,
        model: document.getElementById('modelSelect').value || null,
        enable_fallback: !document.getElementById('strictMode').checked,
        use_google_places: document.getElementById('googlePlaces').checked,
      }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || resp.statusText);
    }

    const data = await resp.json();
    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);

    status.textContent = `Ablation comparison done in ${elapsed}s`;

    // Diff summary card
    const d = data.diff_summary;
    let diffHtml = `<div class="diff-card"><h3>Diff Summary</h3>`;
    diffHtml += `<div class="diff-row"><span class="diff-label">Ranking changed</span><span class="diff-val">${d.ranking_changed ? 'YES' : 'No'}</span></div>`;

    if (Object.keys(d.score_changes).length) {
      for (const [cid, v] of Object.entries(d.score_changes)) {
        diffHtml += `<div class="diff-row diff-changed"><span class="diff-label">${cid} score</span><span class="diff-val">${v.without?.toFixed(4)} <span class="diff-arrow">→</span> ${v.with?.toFixed(4)}</span></div>`;
      }
    }
    if (Object.keys(d.confidence_changes).length) {
      for (const [cid, v] of Object.entries(d.confidence_changes)) {
        diffHtml += `<div class="diff-row diff-changed"><span class="diff-label">${cid} conf</span><span class="diff-val">${v.without?.toFixed(2)} <span class="diff-arrow">→</span> ${v.with?.toFixed(2)}</span></div>`;
      }
    }
    if (Object.keys(d.reason_changes).length) {
      for (const [cid, axes] of Object.entries(d.reason_changes)) {
        diffHtml += `<div class="diff-row diff-changed"><span class="diff-label">${cid} reasons</span><span class="diff-val">${axes.join(', ')}</span></div>`;
      }
    }
    if (Object.keys(d.unknown_changes).length) {
      for (const [cid, v] of Object.entries(d.unknown_changes)) {
        diffHtml += `<div class="diff-row diff-changed"><span class="diff-label">${cid} unknown</span><span class="diff-val">${v.without} <span class="diff-arrow">→</span> ${v.with}</span></div>`;
      }
    }
    if (!Object.keys(d.score_changes).length && !Object.keys(d.confidence_changes).length && !Object.keys(d.reason_changes).length && !Object.keys(d.unknown_changes).length) {
      diffHtml += `<div class="diff-row"><span class="diff-val" style="color:var(--muted)">No differences detected</span></div>`;
    }
    diffHtml += `</div>`;
    diagDiv.innerHTML = diffHtml;

    // Side by side results
    const withRanking = data.with_catalog?.ranking || [];
    const withoutRanking = data.without_catalog?.ranking || [];
    const withSources = data.with_catalog?.candidate_sources || {};
    const withoutSources = data.without_catalog?.candidate_sources || {};

    let leftHtml = withRanking.map(e => renderResult(e, withSources[e.candidate_id])).join('');
    let rightHtml = withoutRanking.map(e => renderResult(e, withoutSources[e.candidate_id])).join('');

    resultsDiv.innerHTML = `<div class="ablation-wrapper">
      <div class="ablation-col"><h3>With Catalog</h3>${leftHtml}</div>
      <div class="ablation-col"><h3>Without Catalog</h3>${rightHtml}</div>
    </div>`;

  } catch (e) {
    status.className = 'status error';
    status.textContent = `Error: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

async function loadSummary() {
  const panel = document.getElementById('summaryPanel');
  try {
    const resp = await fetch('/api/directory-summary');
    const json = await resp.json();
    if (!json.data) {
      panel.style.display = 'block';
      panel.innerHTML = '<div class="summary-panel"><h3>Ablation Summary</h3><div class="summary-row"><span class="summary-val" style="color:var(--muted)">No summary available. Run ablation with --out first.</span></div></div>';
      return;
    }
    const s = json.data;
    const gs = s.gate_summary || {};
    const gateClass = gs.gate_status === 'pass' ? 'gate-pass' : gs.gate_status === 'review_required' ? 'gate-review' : 'gate-empty';
    const mrYn = gs.manual_review_required ? 'yes' : 'no';
    const latest = s.latest_artifact ? s.latest_artifact.artifact_path : 'none';
    const rec = (s.recommended_artifact_paths || []);
    const recHtml = rec.length
      ? `<ul class="summary-list">${rec.map(p => `<li>${p}</li>`).join('')}</ul>`
      : '<span class="summary-val">none</span>';
    const flagged = (s.flagged_rows || []).length;

    panel.style.display = 'block';
    panel.innerHTML = `<div class="summary-panel">
      <h3>Ablation Directory Summary</h3>
      <div class="summary-row"><span class="summary-label">Gate status</span><span class="summary-val ${gateClass}">${gs.gate_status || 'unknown'}</span></div>
      <div class="summary-row"><span class="summary-label">Manual review required</span><span class="summary-val">${mrYn}</span></div>
      <div class="summary-row"><span class="summary-label">Total runs</span><span class="summary-val">${s.total_runs || 0}</span></div>
      <div class="summary-row"><span class="summary-label">Flagged runs</span><span class="summary-val">${flagged}</span></div>
      <div class="summary-row"><span class="summary-label">Latest artifact</span><span class="summary-val">${latest}</span></div>
      <div class="summary-row"><span class="summary-label">Recommended artifacts</span>${recHtml}</div>
    </div>`;
  } catch (e) {
    panel.style.display = 'block';
    panel.innerHTML = `<div class="summary-panel"><span class="summary-val" style="color:var(--red)">Error loading summary: ${e.message}</span></div>`;
  }
}

document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
});
</script>
</body>
</html>
